crds:
  # Install and upgrade the SiteFailover CRD with this release.
  install: true
  # Keep the CRD when the release is uninstalled. Deleting the CRD deletes every SiteFailover ledger with it.
  keep: true
rbac:
  # Create the roles of the permissions table in docs/operations.md#permissions: a ClusterRole, a Role in the
  # release's namespace, which is the ledger namespace, and a Role in each namespace of rbac.objects.
  create: false
  # Also grant delete on sitefailovers in the ledger Role, for tack prune: row 16 of the permissions table.
  prune: false
  # Bind each role to these subjects, such as the operators' group. Empty binds nothing.
  subjects: []
  # - {apiGroup: rbac.authorization.k8s.io, kind: Group, name: dba-oncall}
  # The objects of the Workload files, by namespace and name. A kind without names gets no rule.
  objects: []
  # - namespace: db
  #   clusters: [pg-a] # also grants get on pods and pods/proxy, and get and create on backups, in the namespace
  #   poolers: [pg-a-pooler-rw] # also grants get on the Deployment of the same name
  #   siteServices: [postgres]
  #   objectStores: [pg-a-store] # the barman-cloud ObjectStores that the Clusters archive WAL to
  # - namespace: flux-system
  #   kustomizations: [apps]
  #   gitRepositories: [gitops]
  #   configMaps: [cluster-vars] # those of spec.postBuild.substituteFrom
  #   secrets: []
