        namespace: flux-system
      object:
        apiVersion: postgresql.cnpg.io/v1
        kind: Pooler
        name: pg-a-pooler-rw
        namespace: db
    site: a
    type: Release
  - description: reconcile Flux at site a with the released objects
    id: reconcile-release-a
