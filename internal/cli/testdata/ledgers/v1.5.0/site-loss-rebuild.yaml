        kind: Cluster
        name: pg-a
        namespace: db
      - apiVersion: postgresql.cnpg.io/v1
        kind: Pooler
        name: pg-a-pooler-rw
        namespace: db
  - deferrable: true
    description: check at site b that Git, as Flux renders it, equals live
    id: verify-git-b
