# AGENTS.md, Writing: no history. Git is the archive.
extends: existence
message: "'%s' is history. Say what is true now, and leave the issue to git."
level: error
ignorecase: true
nonword: true
# Issue numbers have 1 to 3 digits; RFC numbers have 4, as in RFC#0002.
tokens:
  - '\(#\d{1,3}\)'
  - '#\d{1,3},? (?:row|item) \d+'
  - 'found in (?:a )?review'
