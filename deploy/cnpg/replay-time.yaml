# Tack's replay-time query, opt-in (docs/workload.md#replay-time). Apply it
# in the namespace of each Cluster, before the Cluster names it in
# spec.monitoring.customQueriesConfigMap. Keep the query and column names:
# Tack reads the metric cnpg_tack_replay_timestamp_seconds.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tack-replay-time
  labels:
    # CloudNativePG reloads the queries when this ConfigMap changes.
    cnpg.io/reload: "true"
data:
  queries: |
    tack_replay:
      query: |
        SELECT pg_catalog.date_part('epoch', pg_catalog.pg_last_xact_replay_timestamp()) AS timestamp_seconds
      metrics:
        - timestamp_seconds:
            usage: GAUGE
            description: Commit time, in seconds since 1970, of the last transaction this instance replayed; NaN when it replayed none since it started
