        name: pg-b
        namespace: db
      - apiVersion: postgresql.cnpg.io/v1
        kind: Pooler
        name: pg-b-pooler-rw
        namespace: db
  to: a
  workload:
    name: pg-main
    spec:
      driver: cnpg
      git:
        branch: main
        find: {}
        url: https://git.example.com/gitops.git
      ledger:
        namespace: tack-system
      sites:
      - cnpg:
          cluster:
            name: pg-a
            namespace: db
          pooler:
            instances: 2
            name: pg-a-pooler-rw
            namespace: db
        kubeContext: site-a
        name: a
