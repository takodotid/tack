metadata:
  labels:
    failover.tako.id/workload: pg-main
  name: pg-main-20261112-100000
  namespace: tack-system
spec:
  fingerprints:
  - kubeSystemUID: uid-a
    site: a
  from: b
  mode: SiteLoss
  steps:
  - description: 'hold Cluster db/pg-a at site a: Flux stops applying it'
    hold:
      kustomization:
        name: a
        namespace: flux-system
      object:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        name: pg-a
        namespace: db
    id: hold-a-cluster-pg-a
    phase: Hold
    site: a
    type: Hold
  - description: 'hold Pooler db/pg-a-pooler-rw at site a: Flux stops applying it'
    hold:
      kustomization:
        name: a
        namespace: flux-system
      object:
        apiVersion: postgresql.cnpg.io/v1
        kind: Pooler
        name: pg-a-pooler-rw
        namespace: db
    id: hold-a-pooler-pg-a-pooler-rw
    phase: Hold
    site: a
    type: Hold
  - description: reconcile Flux at site a, so no apply started before the hold is
      still in flight
    id: reconcile-hold-a
    phase: Hold
    reconcile:
      kustomizations:
      - name: a
        namespace: flux-system
      timeout: 5m0s
    site: a
    type: Reconcile
  - deferrable: true
    description: 'hold Cluster db/pg-b at site b: Flux stops applying it'
    hold:
      object:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        name: pg-b
        namespace: db
    id: hold-b-cluster-pg-b
    phase: Hold
    site: b
    type: Hold
  - deferrable: true
    description: 'hold Pooler db/pg-b-pooler-rw at site b: Flux stops applying it'
    hold:
      object:
        apiVersion: postgresql.cnpg.io/v1
        kind: Pooler
        name: pg-b-pooler-rw
        namespace: db
    id: hold-b-pooler-pg-b-pooler-rw
    phase: Hold
    site: b
    type: Hold
  - deferrable: true
    description: reconcile Flux at site b, so no apply started before the hold is
      still in flight
    id: reconcile-hold-b
    phase: Hold
    reconcile:
      timeout: 5m0s
    site: b
    type: Reconcile
  - deferrable: true
    description: 'fence Cluster pg-b: declare pg-a primary, so it never runs as primary
      again'
    id: fence-b
    patch:
      merge: '{"spec":{"replica":{"primary":"pg-a","promotionToken":null}}}'
      object:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        name: pg-b
        namespace: db
    phase: Failover
    site: b
    type: Patch
  - deferrable: true
    description: set Pooler pg-b-pooler-rw to 0 instances
    id: pooler-b
    patch:
      merge: '{"spec":{"instances":0}}'
      object:
        apiVersion: postgresql.cnpg.io/v1
        kind: Pooler
        name: pg-b-pooler-rw
        namespace: db
    phase: Failover
    site: b
    type: Patch
  - deferrable: true
    description: wait until the Pooler pg-b-pooler-rw runs no pod
    id: wait-pooler-b
    phase: Failover
    site: b
    type: Wait
    wait:
      conditions:
      - jsonPath: '{.status.replicas}'
        operator: Empty
      object:
        apiVersion: apps/v1
        kind: Deployment
        name: pg-b-pooler-rw
        namespace: db
      timeout: 10m0s
  - description: promote Cluster pg-a without a token
    id: promote-a
    patch:
      merge: '{"spec":{"replica":{"primary":"pg-a","promotionToken":null}}}'
      object:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        name: pg-a
        namespace: db
    phase: Failover
    site: a
    type: Patch
  - description: wait until Cluster pg-a runs a healthy primary
    id: wait-promoted-a
    phase: Failover
    site: a
    type: Wait
    wait:
      conditions:
      - jsonPath: '{.status.instancesReportedState.*.isPrimary}'
        operator: Contains
        value: "true"
      - jsonPath: '{.status.phase}'
        operator: Equals
        value: Cluster in healthy state
      object:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        name: pg-a
        namespace: db
      timeout: 10m0s
  - description: set Pooler pg-a-pooler-rw to 2 instances
    id: pooler-a
    patch:
      merge: '{"spec":{"instances":2}}'
      object:
        apiVersion: postgresql.cnpg.io/v1
        kind: Pooler
        name: pg-a-pooler-rw
        namespace: db
    phase: Failover
    site: a
    type: Patch
  - description: wait until the Pooler pg-a-pooler-rw has 2 ready pods
    id: wait-pooler-a
    phase: Failover
    site: a
    type: Wait
    wait:
      conditions:
      - jsonPath: '{.status.readyReplicas}'
        operator: Equals
        value: "2"
      object:
        apiVersion: apps/v1
        kind: Deployment
        name: pg-a-pooler-rw
        namespace: db
      timeout: 10m0s
  - description: verify that Cluster pg-a is a healthy primary and declares itself
    id: verify-a
    phase: Failover
    site: a
    type: Wait
    wait:
      conditions:
      - jsonPath: '{.spec.replica.primary}'
        operator: Equals
        value: pg-a
      - jsonPath: '{.status.instancesReportedState.*.isPrimary}'
        operator: Contains
        value: "true"
      - jsonPath: '{.status.phase}'
        operator: Equals
        value: Cluster in healthy state
      object:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        name: pg-a
        namespace: db
      timeout: 10m0s
  - description: commit the live state to https://git.example.com/gitops.git branch
      main
    git:
      changes:
      - field: spec.replica.primary
        file: clusters/a/cluster.yaml
        object:
          apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          name: pg-a
          namespace: db
        path: spec.replica.primary
        site: a
        value: '"pg-a"'
      - field: spec.replica.promotionToken
        file: clusters/a/cluster.yaml
        object:
          apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          name: pg-a
          namespace: db
        path: spec.replica.promotionToken
        site: a
      - field: spec.instances
        file: clusters/a/pooler.yaml
        object:
          apiVersion: postgresql.cnpg.io/v1
          kind: Pooler
          name: pg-a-pooler-rw
          namespace: db
        path: spec.instances
        site: a
        value: "2"
      - field: spec.replica.primary
        file: clusters/b/cluster.yaml
        object:
          apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          name: pg-b
          namespace: db
        path: spec.replica.primary
        site: b
        value: '"pg-a"'
      - field: spec.replica.promotionToken
        file: clusters/b/cluster.yaml
        object:
          apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          name: pg-b
          namespace: db
        path: spec.replica.promotionToken
        site: b
      - field: spec.instances
        file: clusters/b/pooler.yaml
        object:
          apiVersion: postgresql.cnpg.io/v1
          kind: Pooler
          name: pg-b-pooler-rw
          namespace: db
        path: spec.instances
        site: b
        value: "0"
      message: |-
        tack: pg-main primary b to a (siteloss)

        Run pg-main-20261112-100000, mode SiteLoss.
    id: git-commit
    phase: PromoteToGitOps
    type: Git
  - description: wait for Flux at site a to apply the run's commit (held objects stay
      as they are)
    id: reconcile-git-a
    phase: PromoteToGitOps
    reconcile:
      kustomizations:
      - name: a
        namespace: flux-system
      revision: $(git.commit)
      timeout: 5m0s
    site: a
    type: Reconcile
  - deferrable: true
    description: wait for Flux at site b to apply the run's commit (held objects stay
      as they are)
    id: reconcile-git-b
    phase: PromoteToGitOps
    reconcile:
      revision: $(git.commit)
      timeout: 5m0s
    site: b
    type: Reconcile
  - description: check at site a that Git, as Flux renders it, equals live
    id: verify-git-a
    phase: Release
    site: a
    type: VerifyGit
    verifyGit:
      fields:
      - field: spec.replica.primary
        object:
          apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          name: pg-a
          namespace: db
      - field: spec.replica.promotionToken
        object:
          apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          name: pg-a
          namespace: db
      - field: spec.instances
        object:
          apiVersion: postgresql.cnpg.io/v1
          kind: Pooler
          name: pg-a-pooler-rw
          namespace: db
      objects:
      - apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        name: pg-a
        namespace: db
      - apiVersion: postgresql.cnpg.io/v1
        kind: Pooler
        name: pg-a-pooler-rw
        namespace: db
  - description: 'release Cluster db/pg-a at site a: Flux applies it again'
    id: release-a-cluster-pg-a
    phase: Release
    release:
      kustomization:
        name: a
        namespace: flux-system
      object:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        name: pg-a
        namespace: db
    site: a
    type: Release
  - description: 'release Pooler db/pg-a-pooler-rw at site a: Flux applies it again'
