            name: pg-b
            namespace: db
          pooler:
            instances: 2
            name: pg-b-pooler-rw
            namespace: db
        kubeContext: site-b
        name: b
      timeouts:
        demotion: 10m0s
        flux: 5m0s
        promotion: 10m0s
        routing: 2m0s
