    reconcile:
      kustomizations:
      - name: a
        namespace: flux-system
      revision: $(git.commit)
      timeout: 5m0s
    site: a
    type: Reconcile
  - description: check at site a that Flux changed nothing
    id: verify-noop-a
    phase: Release
    site: a
    type: VerifyNoop
    verifyNoop:
