# CloudNativePG Cluster at site c, a third site in the distributed topology with
# pg-a and pg-b, for the three-site scenarios (TACK_E2E_SITES="a b c"). It
# streams from pg-a, and from pg-a's designated primary once pg-a is a replica.
# The Secrets tack-e2e-server-ca, tack-e2e-client-ca and app-credentials are
# created at runtime by test/e2e/env/up.sh. They are never in Git.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-c
  namespace: db
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:44d17e8570dc25055376148a2918840def5bef0193969be3e79101afa25eafc2
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  postgresql:
    parameters:
      shared_buffers: 64MB
  certificates:
    serverCASecret: tack-e2e-server-ca
    clientCASecret: tack-e2e-client-ca
    serverAltDNSNames:
      - tack-e2e-c-control-plane
  managed:
    services:
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: pg-c-rw-nodeport
            spec:
              type: NodePort
              ports:
                - name: postgres
                  port: 5432
                  targetPort: 5432
                  nodePort: 30432
  bootstrap:
    pg_basebackup:
      source: pg-a
      database: app
      owner: app
      secret:
        name: app-credentials
  replica:
    self: pg-c
    primary: pg-a
    source: pg-a
  externalClusters:
    - name: pg-a
      connectionParameters:
        host: tack-e2e-a-control-plane
        port: "30432"
        user: streaming_replica
        dbname: postgres
        sslmode: verify-full
      sslKey:
        name: pg-c-replication
        key: tls.key
      sslCert:
        name: pg-c-replication
        key: tls.crt
      sslRootCert:
        name: tack-e2e-server-ca
        key: ca.crt
    - name: pg-b
      connectionParameters:
        host: tack-e2e-b-control-plane
        port: "30432"
        user: streaming_replica
        dbname: postgres
        sslmode: verify-full
      sslKey:
        name: pg-c-replication
        key: tls.key
      sslCert:
        name: pg-c-replication
        key: tls.crt
      sslRootCert:
        name: tack-e2e-server-ca
        key: ca.crt
    - name: pg-c
      connectionParameters:
        host: tack-e2e-c-control-plane
        port: "30432"
        user: streaming_replica
        dbname: postgres
        sslmode: verify-full
      sslKey:
        name: pg-c-replication
        key: tls.key
      sslCert:
        name: pg-c-replication
        key: tls.crt
      sslRootCert:
        name: tack-e2e-server-ca
        key: ca.crt
