# On a tag vX.Y.Z: the CLI archives with the man pages and the CRD, the CRD's Helm chart, and the GitHub release.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: make verify test
      - run: make dist VERSION="$GITHUB_REF_NAME"
      - name: Helm chart
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          helm lint deploy/helm/tack
          helm package deploy/helm/tack --version "$v" --app-version "$v" -d dist
          printf '%s' "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          helm push "dist/tack-$v.tgz" oci://ghcr.io/takodotid/charts
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp config/crd/failover.tako.id_sitefailovers.yaml dist/
          cd dist
          sha256sum *.tar.gz *.tgz failover.tako.id_sitefailovers.yaml > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Tack $GITHUB_REF_NAME" --generate-notes *.tar.gz *.tgz SHA256SUMS failover.tako.id_sitefailovers.yaml
