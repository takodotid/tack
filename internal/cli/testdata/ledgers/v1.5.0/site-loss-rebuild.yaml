      - field: spec.replica.primary
        object:
          apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          name: pg-b
          namespace: db
      - field: spec.replica.promotionToken
        object:
          apiVersion: postgresql.cnpg.io/v1
